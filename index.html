
        
        <!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 대화 메이트 - 최적의 답변 솔루션</title>
    <style>
        :root {
            --kakaotalk-yellow: #FEE500;
            --kakaotalk-bg: #BACEE0;
            --kakaotalk-chat-ai: #FFFFFF;
            --text-main: #191919;
            --text-sub: #666666;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

        .app-container {
            width: 100%; max-width: 480px; height: 90vh;
            background-color: var(--kakaotalk-bg);
            border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex; flex-direction: column; overflow: hidden;
        }

        .header { background-color: #A9BDCE; padding: 15px 20px; display: flex; align-items: center; gap: 12px; }
        .profile-img { width: 42px; height: 42px; background-color: var(--kakaotalk-yellow); border-radius: 15px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .header-info h2 { font-size: 16px; color: var(--text-main); }

        .chat-content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .bubble { max-width: 85%; padding: 12px 16px; border-radius: 15px; font-size: 14px; line-height: 1.5; background: #fff; }

        .input-card { background: #fff; padding: 18px; border-radius: 15px; display: flex; flex-direction: column; gap: 12px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 12px; font-weight: bold; color: var(--text-sub); }
        .input-group textarea, .input-group input { padding: 10px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 13px; outline: none; }

        .btn-submit { background-color: var(--kakaotalk-yellow); color: #3C1E1E; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        
        /* 로딩 표시 */
        .loading { display: none; text-align: center; font-size: 13px; color: #555; padding: 10px; }

        .result-container { display: flex; flex-direction: column; gap: 12px; }
        .analysis-box { background: #EBF3FA; border-left: 4px solid #4A90E2; padding: 12px; border-radius: 8px; font-size: 13px; }
        .option-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 14px; }
        .option-tag { display: inline-block; font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 12px; margin-bottom: 6px; }
        .tag-1 { background: #E3F2FD; color: #1976D2; }
        .tag-2 { background: #FFEBEE; color: #D32F2F; }
        .tag-3 { background: #E8F5E9; color: #388E3C; }
        .tag-4 { background: #FFF3E0; color: #F57C00; }
        .option-text { font-size: 13px; color: #333; margin-bottom: 8px; }

        /* 하단 입력창 (활성화) */
        .footer-bar { background: #ffffff; padding: 12px 15px; display: flex; gap: 10px; border-top: 1px solid #eee; }
        .footer-input { flex: 1; border: 1px solid #ddd; padding: 8px 12px; border-radius: 20px; font-size: 13px; outline: none; }
        .btn-send { background: var(--kakaotalk-yellow); border: none; padding: 8px 15px; border-radius: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="profile-img">AI</div>
        <div class="header-info">
            <h2>대화 솔루션 메이트</h2>
        </div>
    </div>

    <div class="chat-content" id="chatArea">
        <div class="bubble">
            상대방 정보와 상황, 감정을 입력하시면 AI가 맞춤 답변 4가지를 생성합니다.
        </div>

        <!-- API 키 입력칸 (테스트용) -->
        <div class="input-card">
            <div class="input-group">
                <label>OpenAI API Key (실제 작동에 필요)</label>
                <input type="password" id="apiKey" placeholder="sk-...">
            </div>
            <div class="input-group">
                <label>1. 상대방 성격/가치관</label>
                <input type="text" id="persona" placeholder="예: 회피형, 자존심이 셈">
            </div>
            <div class="input-group">
                <label>2. 오늘 발생한 일 & 대화</label>
                <textarea id="context" rows="3" placeholder="상황과 주고받은 말을 적어주세요"></textarea>
            </div>
            <div class="input-group">
                <label>3. 나의 감정 상태</label>
                <input type="text" id="emotion" placeholder="예: 서운함, 화남">
            </div>
            <button class="btn-submit" onclick="callRealAI()">AI 답변 생성하기</button>
        </div>

        <div class="loading" id="loadingText">AI가 상대방 심리를 분석하고 맞춤 답안을 작성 중입니다...</div>

        <!-- AI 결과 출력 위치 -->
        <div class="result-container" id="resultArea" style="display: none;"></div>
    </div>

    <!-- 하단 질문 추가 입력창 (실제 입력 가능하도록 수정) -->
    <div class="footer-bar">
        <input type="text" class="footer-input" id="followUpInput" placeholder="추가 상황이나 질문을 입력하세요...">
        <button class="btn-send" onclick="sendFollowUp()">전송</button>
    </div>
</div>

<script>
    async function callRealAI() {
        const apiKey = document.getElementById('apiKey').value;
        const persona = document.getElementById('persona').value;
        const context = document.getElementById('context').value;
        const emotion = document.getElementById('emotion').value;

        if (!apiKey) {
            alert('OpenAI API Key를 입력해 주세요!');
            return;
        }
        if (!persona || !context || !emotion) {
            alert('모든 입력칸을 채워주세요!');
            return;
        }

        document.getElementById('loadingText').style.display = 'block';
        document.getElementById('resultArea').style.display = 'none';

        const prompt = `
너는 대화 심리 전문가야. 다음 정보를 바탕으로 상대방 속마음을 분석하고, 사용자 감정을 고려한 최적의 답변 4가지를 JSON 형식으로 작성해줘.

[상대방 성격/가치관]: ${persona}
[오늘 상황/대화]: ${context}
[사용자 감정]: ${emotion}

응답은 반드시 아래 JSON 구조로만 작성해줘:
{
  "analysis": "상대방 속마음 해석 2~3줄",
  "opt1": "공감 우선형 답장",
  "opt2": "단도직입/솔직형 답장",
  "opt3": "분위기 완화/쿠션어 답장",
  "opt4": "위트/기분전환형 답장"
}
`;

        try {
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: 'gpt-4o-mini',
                    messages: [{ role: 'user', content: prompt }],
                    response_format: { type: "json_object" }
                })
            });

            const data = await response.json();
            const result = JSON.parse(data.choices[0].message.content);

            // 결과 화면 그리기
            const resultArea = document.getElementById('resultArea');
            resultArea.innerHTML = `
                <div class="analysis-box">🔍 <b>속마음 해석:</b><br>${result.analysis}</div>
                <div class="option-card"><span class="option-tag tag-1">1. 공감 우선형</span><p class="option-text">${result.opt1}</p></div>
                <div class="option-card"><span class="option-tag tag-2">2. 단도직입형</span><p class="option-text">${result.opt2}</p></div>
                <div class="option-card"><span class="option-tag tag-3">3. 분위기 완화형</span><p class="option-text">${result.opt3}</p></div>
                <div class="option-card"><span class="option-tag tag-4">4. 위트/전환형</span><p class="option-text">${result.opt4}</p></div>
            `;
            
            resultArea.style.display = 'flex';
        } catch (error) {
            alert('AI 응답 생성 실패: API Key 및 네트워크 상태를 확인하세요.');
            console.error(error);
        } finally {
            document.getElementById('loadingText').style.display = 'none';
        }
    }

    function sendFollowUp() {
        const input = document.getElementById('followUpInput');
        if (!input.value) return;

        const chatArea = document.getElementById('chatArea');
        const myBubble = document.createElement('div');
        myBubble.className = 'bubble';
        myBubble.style.alignSelf = 'flex-end';
        myBubble.style.background = '#FEE500';
        myBubble.innerText = input.value;
        chatArea.appendChild(myBubble);

        input.value = '';
        chatArea.scrollTop = chatArea.scrollHeight;
    }
</script>

</body>
</html>
